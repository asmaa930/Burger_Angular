<section id="Book_Now">

    <div class="container">

        <div class="title">
            <h2 class="display-3 fw-medium text-light text-center mb-5">Book Now</h2>
        </div>

        <div class="content">
            <form method="post">
                <div class="input">
                    <label class="form-label" for="Name">Name :</label>
                    <input class="form-control" type="text" name="name" id="Name" required maxlength="50" minlength="5"
                        autocomplete="off">
                </div>

                <div class="input">
                    <label class="form-label" for="Num_people">How many people :</label>
                    <input class="form-control" type="text" name="num_people" id="Num_people" required
                        autocomplete="off">
                </div>

                <div class="input">
                    <label class="form-label" for="Date">Date :</label>
                    <input class="form-control" type="datetime-local" name="date" id="Date" required autocomplete="off">
                </div>

                <div class="input">
                    <label class="form-label" for="Message">Message :</label>
                    <textarea class="form-control" name="message" id="Message"></textarea>
                </div>

                <button class="btn w-100 ">Book</button>
            </form>
        </div>
    </div>

</section>
